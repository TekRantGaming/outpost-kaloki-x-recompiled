# Publishes the Windows builder when a version tag (v*) is pushed.
# The builder contains only this repository's files; players build the game
# on their own PC from their own XBLA package, so no game code is released.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand (e.g. with a zip already checked on VirusTotal)
          # must not be replaced.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Package the builder
        if: env.SKIP != '1'
        run: |
          name="OutpostKalokiX-Builder-${GITHUB_REF_NAME}-windows"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD
          echo "ZIP=${name}.zip" >> "$GITHUB_ENV"
          unzip -l "${name}.zip" | tail -1

      - name: Publish the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
